  const nav=app.querySelector('.panel > .nav:last-child');if(nav&&!nav.querySelector('[data-act="mkprint"]'))nav.insertAdjacentHTML('afterbegin',`<button class="btn ghost" data-act="mkprint">Print a paper</button>`)};
/* printable paper with answer key */
function printPaper(L){const P=mkBuild(L),tot=P.items.reduce((a,i)=>a+i.marks,0);let n=0;const sec=k=>P.items.filter(i=>i.sec===k);
  const qhtml=it=>{n++;const Q=it.Q;let body='';
    if(it.sec==='A')body=`<ol class="popts">${it.opts.map((o,i)=>`<li>(${i+1}) ${mkOptText(Q,o)}</li>`).join('')}</ol><div class="pans">(&nbsp;&nbsp;&nbsp;&nbsp;)</div>`;
    else if(it.sec==='B')body=`<div class="pans">Ans: ______________ ${Q.unit||''}</div>`;
    else body=`<div class="pwork"></div><div class="pans">Ans: ______________ ${Q.unit||''}</div>`;
    it.no=n;return `<div class="pq"><div class="pqh"><b>${n}.</b><span class="pm">[${it.marks}]</span></div><div class="pqt">${Q.q}</div>${Q.svg?`<div class="pfig">${Q.svg}</div>`:''}${Q.bar?'<div class="pfig pnote">Draw a model.</div>':''}${body}</div>`};
  const secH={A:'Section A · Choose the correct answer. Write its number in the brackets.',B:'Section B · Write your answer on the line.',C:'Section C · Show your working clearly.'};
  const paper=['A','B','C'].map(k=>`<h3 class="psec">${secH[k]}</h3>${sec(k).map(qhtml).join('')}`).join('');
  const key=P.items.map(it=>{const Q=it.Q,ans=it.sec==='A'?`(${it.opts.findIndex(o=>o.ok)+1}) ${mkOptText(Q,it.opts.find(o=>o.ok))}`:`${fullAns(Q)}`;const st=Q.bar?Q.bar.calc.map(c=>c.t):Q.steps;return `<div class="pk"><b>${it.no}.</b> ${ans}${it.sec==='C'?`<small>${st.join(' · ')}</small>`:''}</div>`}).join('');
  S.view='print';document.body.classList.add('printing');
  app.innerHTML=`<div class="no-print ptools"><button class="back" data-act="unprint">← Back</button><button class="btn" data-act="doprint">Print</button><span class="lvlnote">Tip: print single-sided. The answer key starts on a new page.</span></div>
  <div class="printpaper"><div class="phead"><h2>P${L} Mathematics · Practice Paper</h2><div>Name: ____________________ &nbsp; Date: ___________ &nbsp; Marks: ____ / ${tot}</div></div>${paper}
  <div class="pkey"><h2>Answer key · P${L} Practice Paper</h2>${key}</div></div>`;window.scrollTo(0,0)}
const _gA12=gymAct;gymAct=function(a,el){
  if(a==='mkprint'){const L=MK&&MK.lvl||S.lvl;if(S.view==='mock'&&MK&&MK.pos>=MK.order.length){S.view='leaving';setTimeout(flushQueue,500)}printPaper(L);return true}
  if(a==='doprint'){try{window.print()}catch(e){toast('Use your browser menu to print this page.')}return true}
  if(a==='unprint'){document.body.classList.remove('printing');S.view='home';home();window.scrollTo(0,0);return true}
  return _gA12(a,el)};
const _pv12=parentsView;parentsView=function(){_pv12();const h=app.querySelector('.mkhist');if(!h||app.querySelector('.pvprint'))return;
  const M=(D.mocks||[]).slice(0,5),agg={};M.forEach(m=>Object.entries(m.slips||{}).forEach(([k,v])=>agg[k]=(agg[k]||0)+v));const ks=Object.keys(agg).sort((a,b)=>agg[b]-agg[a]);
  h.insertAdjacentHTML('beforeend',`${ks.length?`<p class="lvlnote"><b>Most common slips (last ${M.length} mocks):</b> ${ks.slice(0,3).map(k=>`${SLIPS[k][0].toLowerCase()} ×${agg[k]}`).join(', ')}.</p>`:''}<div class="pvprint"><button class="btn ghost small" data-act="mkprint">Print a P${S.lvl} practice paper (with answer key)</button></div>`)};

/* ================= ROUND 13: depth tracker, smart variety, worksheets ================= */
const tyKey=(Q,hi)=>Q.vk||('base:'+(hi?'h':'a'));
const TYC={};
function typesOf(t){if(TYC[t.id])return TYC[t.id];const s=new Set(),tiers=t.strand==='Olympiad'?[true]:[false,true];for(const hi of tiers)for(let i=0;i<160;i++){try{s.add(tyKey(t.gen(hi),hi))}catch(e){}}return TYC[t.id]=s}
const tySolved=id=>new Set((D.types&&D.types[id])||[]);
function tyRecord(id,Q,hi){const t=byId(id);if(!t||!t.skill||!Q)return;D.types=D.types||{};const a=D.types[id]||(D.types[id]=[]),k=tyKey(Q,hi);if(a.includes(k))return;a.push(k);saveD();
  const tot=typesOf(t).size,n=Math.min(a.length,tot);if(tot<2)return;toast(n>=tot?`<b>${t.title}</b>: every kind of question solved! ★`:`New kind of question solved · ${t.title} ${n}/${tot}`,'gold')}
const _ac13=answerCheck;answerCheck=function(p,id,tt){_ac13(p,id,tt);if(p.ok&&p.stage==='done'&&!p.tyDone){p.tyDone=true;tyRecord(id,p.Q,p.hi)}};
const _spc13=spCheck;spCheck=function(){const c=SP&&SP.cur;_spc13();if(c&&c.ok&&!c.tyDone){c.tyDone=true;tyRecord(c.tid,c.Q,c.hi)}};
const _mkMark13=mkMark;mkMark=function(it,resp){_mkMark13(it,resp);if(resp&&resp.got===it.marks)tyRecord(it.tid,it.Q,it.hi)};
/* smart practice: prefer a question type not solved yet */
const _skNew13=skNew;skNew=function(){_skNew13();const p=S.p,t=S.topic;if(!p||!t||p.kind!=='skill')return;const done=tySolved(t.id);if(!done.has(tyKey(p.Q,p.hi)))return;
  for(let k=0;k<12;k++){const Q=norm(t.gen(p.hi));if(!done.has(tyKey(Q,p.hi))&&!(S.seenQ&&S.seenQ.has(Q.q))){delete p.w;delete p.ow;delete p.wg;delete p.strat;p.Q=Q;p.stage=preStage(p);S.seenQ&&S.seenQ.add(Q.q);return}}};
/* topic page: types chip + worksheet button */
const _skP13=skPractice;skPractice=function(){_skP13();const t=S.topic;if(!t||!t.skill)return;const nav=app.querySelector('.panel .nav');if(!nav||nav.querySelector('.tychip'))return;
  const tot=typesOf(t).size,n=Math.min(tySolved(t.id).size,tot);if(tot<2){nav.insertAdjacentHTML('beforeend',`<button class="btn ghost small" data-act="topicprint">Print worksheet</button>`);return}nav.insertAdjacentHTML('beforeend',`<span class="tychip${n>=tot?' gold':''}" title="Different question types solved in this topic">${n>=tot?'★ ':''}Kinds ${n}/${tot}</span><button class="btn ghost small" data-act="topicprint">Print worksheet</button>`)};
function printTopic(t){const items=[],seen=new Set();let k=0;while(items.length<12&&k<400){k++;const hi=items.length>=5||t.strand==='Olympiad';const Q=norm(t.gen(hi)),key=tyKey(Q,hi);if(seen.has(key)&&k<200)continue;if(items.some(x=>x.Q.q===Q.q))continue;seen.add(key);items.push({Q,hi})}
  const qs=items.map((it,i)=>`<div class="pq"><div class="pqh"><b>${i+1}.</b><span class="pm">${it.hi?'High ability':'Average'}</span></div><div class="pqt">${it.Q.q}</div>${it.Q.svg?`<div class="pfig">${it.Q.svg}</div>`:''}${it.hi?'<div class="pwork"></div>':''}<div class="pans">Ans: ______________ ${it.Q.unit||''}</div></div>`).join('');
  const key=items.map((it,i)=>`<div class="pk"><b>${i+1}.</b> ${fullAns(it.Q)}<small>${it.Q.steps.join(' · ')}</small></div>`).join('');
  S.view='print';document.body.classList.add('printing');
  app.innerHTML=`<div class="no-print ptools"><button class="back" data-act="unprint">← Back</button><button class="btn" data-act="doprint">Print</button><span class="lvlnote">${items.length} questions, ${seen.size} different types. Answer key on the last page.</span></div>
  <div class="printpaper"><div class="phead"><h2>P${t.lvl} · ${t.title} · Worksheet</h2><div>Name: ____________________ &nbsp; Date: ___________ &nbsp; Score: ____ / ${items.length}</div></div>${qs}<div class="pkey"><h2>Answer key · ${t.title}</h2>${key}</div></div>`;window.scrollTo(0,0)}
const _gA13=gymAct;gymAct=function(a,el){if(a==='topicprint'&&S.topic){printTopic(S.topic);return true}if(a==='unprint'&&S.topic&&S.mode==='practice'&&document.body.classList.contains('printing')){document.body.classList.remove('printing');S.view='topic';topicView();window.scrollTo(0,0);return true}return _gA13(a,el)};
/* parent page: depth report for the current level */
const _pv13=parentsView;parentsView=function(){_pv13();const pn=app.querySelector('.panel');if(!pn||pn.querySelector('.tyrep'))return;const L=S.lvl,ts=SK.filter(t=>t.lvl===L);
  const rows=ts.map(t=>{const tot=typesOf(t).size,n=Math.min(tySolved(t.id).size,tot);return{t,n,tot}}).sort((a,b)=>a.n/a.tot-b.n/b.tot);const all=rows.reduce((a,r)=>a+r.n,0),T=rows.reduce((a,r)=>a+r.tot,0);
  const html=`<h3 class="ph">${me().name}: question types solved at P${L} (${all} of ${T})</h3><div class="tyrep"><p class="lvlnote">Each topic has several kinds of question (reverse, two-step, greatest possible…). Solving every kind is the real sign a topic is secure.</p><table class="dtable"><tbody>${rows.slice(0,8).map(r=>`<tr><td>${r.t.title}</td><td>${r.n}/${r.tot}</td><td>${r.n>=r.tot?'★ complete':r.n/r.tot<.34?'just started':''}</td></tr>`).join('')}</tbody></table>${rows.length>8?`<p class="lvlnote">Showing the 8 topics with the most kinds still to try.</p>`:''}</div>`;
  const anchor=pn.querySelector('.mkhist');const h=anchor&&anchor.previousElementSibling;if(h)h.insertAdjacentHTML('beforebegin',html);else pn.insertAdjacentHTML('beforeend',html)};

/* round 14: P1–P2 sprints get at most 2 Olympiad questions besides the Boss */
const _spPick14=spPickItem;spPickItem=function(){let it=_spPick14();if(S.lvl<=2&&SP&&SP.mode==='sprint'&&!it.boss&&!it.twin){const isO=x=>byId(x.tid).strand==='Olympiad';for(let k=0;k<8&&isO(it)&&(SP.olyN||0)>=2;k++)it=_spPick14();if(isO(it))SP.olyN=(SP.olyN||0)+1}return it};
const _closeOv14=closeOv;closeOv=function(){_closeOv14();setTimeout(()=>{if(OV.hidden)flushQueue()},250)};
applyFreeze();applyDevice();renderLevels();hud();home();welcome();

</script>
